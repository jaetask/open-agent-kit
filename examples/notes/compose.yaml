# One notes App. Run from the repository root:
#   docker compose -f examples/notes/compose.yaml up --build
# The setup secret is printed once in the log at first start:
#   docker compose -f examples/notes/compose.yaml logs notes
# The model comes from the environment: KIT_MODEL with its provider's key,
# or KIT_OPENAI_BASE_URL for an OpenAI-compatible server.
services:
  notes:
    build:
      context: ../..
      dockerfile: examples/notes/Dockerfile
    ports: ["3120:3120"]
    volumes: [notes-data:/data]
    environment:
      KIT_SETUP_SECRET: ${KIT_SETUP_SECRET:-}
      KIT_MODEL: ${KIT_MODEL:-}
      KIT_OPENAI_BASE_URL: ${KIT_OPENAI_BASE_URL:-}
      KIT_OPENAI_API_KEY: ${KIT_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
volumes:
  notes-data:
