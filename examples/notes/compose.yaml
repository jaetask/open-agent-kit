services:
  notes:
    build:
      context: ../..
      dockerfile: examples/notes/Dockerfile
    ports: ["3120:3120"]
    volumes: [notes-data:/data]
    environment:
      KIT_SETUP_SECRET: ${KIT_SETUP_SECRET:-}
      KIT_MODEL: ${KIT_MODEL:-}
      KIT_OPENAI_BASE_URL: ${KIT_OPENAI_BASE_URL:-}
      KIT_OPENAI_API_KEY: ${KIT_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
volumes:
  notes-data:
